aid: contra
name: Contra
description: >-
  Contra is an independent-first, commission-free freelance marketplace and
  professional network for the jobs and skills of the future, founded in 2019
  by Ben Huffman and Gajus Kuizinas and backed by Cowboy Ventures, Unusual
  Ventures, and NEA. Independents build a portfolio, get discovered, and manage
  work from inquiry to contract to payment without platform commissions. For
  developers, Contra exposes a read-only Public API (programs, filters, and
  expert profiles under https://contra.com/public-api/, authenticated with an
  X-API-Key header), an attribute-driven Webflow SDK, a React UI-kit, and a
  hosted, OAuth 2.1-protected Model Context Protocol (MCP) server at
  https://contra.com/mcp (scope mcp:tools).
